name: Quality Check

on:
  pull_request:
    branches:
      - main
      - dev

  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Repository Conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Validate pull request metadata
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          branch_pattern='^(dev|(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9]+([._-][a-z0-9]+)*)$'
          title_pattern='^(dev|(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+)'

          if [[ ! "$BRANCH" =~ $branch_pattern ]]; then
            echo "Invalid branch name: $BRANCH"
            echo "Expected format:"
            echo "  feat/feature-name"
            echo "  fix/bug-name"
            echo "  docs/update-readme"
            echo "  refactor/module-name"
            exit 1
          fi

          if [[ ! "$TITLE" =~ $title_pattern ]]; then
            echo "Invalid pull request title: $TITLE"
            echo "Expected Conventional Commit format:"
            echo "  feat: add login page"
            echo "  fix(auth): handle expired token"
            echo "  refactor!: update API structure"
            exit 1
          fi

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend Format & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend dependencies
        working-directory: backend
        run: dotnet restore

      - name: Verify backend formatting
        working-directory: backend
        run: dotnet format --verify-no-changes --no-restore

      - name: Run backend tests
        working-directory: backend
        run: dotnet test --configuration Release --no-restore
